<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- Rounded square blue background -->
  <rect x="4" y="4" width="72" height="72" rx="18" ry="18" fill="#2F57E5"/>

  <!-- Larger graduation cap icon -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- cap top -->
    <polygon points="20,34 40,22 60,34 40,46"/>
    <!-- cap underside -->
    <path d="M26 38 L40 46 L54 38"/>
    <!-- headband -->
    <path d="M26 38 V46 C26 51 32 55 40 55 C48 55 54 51 54 46 V38"/>
    <!-- tassel -->
    <path d="M60 34 V50"/>
    <circle cx="60" cy="52.5" r="2.6" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>
