name: container-ci-cd

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: container-ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  LOCAL_IMAGE: frontend-ci:${{ github.sha }}

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Create production container Dockerfile
        shell: bash
        run: |
          cat > Dockerfile.ci <<'DOCKERFILE'
          FROM node:20.18.1-alpine3.21 AS build
          WORKDIR /app
          COPY package.json package-lock.json ./
          RUN npm ci
          COPY . .
          RUN npm run build

          FROM nginxinc/nginx-unprivileged:1.27.3-alpine AS runtime
          COPY --from=build /app/dist/ /usr/share/nginx/html/
          DOCKERFILE

      - name: Build image
        run: docker build --file Dockerfile.ci --tag "$LOCAL_IMAGE" .

      - name: Export image
        run: docker save "$LOCAL_IMAGE" --output image.tar

      - name: Upload built image
        uses: actions/upload-artifact@v4.6.2
        with:
          name: container-image-${{ github.sha }}
          path: image.tar
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test frontend
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 20.18.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project tests when defined
        run: npm run test --if-present

      - name: Validate production build
        run: |
          npm run build
          test -s dist/index.html

  scan:
    name: Scan container image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Download built image
        uses: actions/download-artifact@v4.3.0
        with:
          name: container-image-${{ github.sha }}

      - name: Load built image
        run: docker load --input image.tar

      - name: Scan for high and critical vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            "$LOCAL_IMAGE"

  push:
    name: Push commit image to Azure Container Registry
    runs-on: ubuntu-latest
    needs: scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      PUSHED_IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_NAME }}:${{
