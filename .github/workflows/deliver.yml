name: Container CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  LOCAL_IMAGE: local/static-frontend:${{ github.sha }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create production Dockerfile
        shell: bash
        run: |
          cat > .ci.Dockerfile <<'EOF'
          FROM node:22-alpine3.22 AS build
          WORKDIR /app
          COPY package.json package-lock.json ./
          RUN npm ci
          COPY . .
          RUN npm run build

          FROM alpine:3.22 AS runtime
          RUN addgroup -S static && adduser -S -G static static
          WORKDIR /srv
          COPY --from=build --chown=static:static /app/dist/ /srv/
          USER static
          EXPOSE 8080
          CMD ["busybox", "httpd", "-f", "-p", "8080", "-h", "/srv"]
          EOF

      - name: Build image
        run: docker build --file .ci.Dockerfile --tag "$LOCAL_IMAGE" .

      - name: Export image
        run: docker save --output service-image.tar "$LOCAL_IMAGE"

      - name: Upload built image
        uses: actions/upload-artifact@v4
        with:
          name: service-image-${{ github.sha }}
          path: service-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  test:
    name: test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests or build validation
        shell: bash
        run: |
          if node -e "const p = require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            npm test
          else
            echo 'No test script is defined; validating the production build instead.'
            npm run build
          fi

  scan:
    name: scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: service-image-${{ github.sha }}
          path: image-artifact

      - name: Load built image
        run: docker load --input image-artifact/service-image.tar

      - name: Scan image for high and critical vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.2 \
            image --exit-code 1 --severity HIGH,CRITICAL "$LOCAL_IMAGE"

  push:
    name: push
    runs-on: ubuntu-latest
    needs: scan
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    steps:
      - name: Download scanned image
        uses: actions/download-artifact@v4
        with:
          name: service-image-${{ github.sha }}
          path: image-artifact

      - name: Load scanned image
        run: docker load --input image-artifact/service-image.tar

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Tag and push exact commit image
        shell: bash
        run: |
          TARGET_IMAGE="${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}"
          docker tag "$LOCAL_IMAGE" "$TARGET_IMAGE"
          docker push "$TARGET_IMAGE"

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: push
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    steps:
      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy exact commit image to Azure Container Apps
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}"
