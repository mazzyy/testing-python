name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  LOCAL_IMAGE: local/vite-static:${{ github.sha }}
  TARGET_IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image from Dockerfile
        run: docker build --tag "$LOCAL_IMAGE" .

      - name: Save built image
        run: docker save --output "${{ runner.temp }}/container-image.tar" "$LOCAL_IMAGE"

      - name: Upload built image
        uses: actions/upload-artifact@v4
        with:
          name: container-image-${{ github.sha }}
          path: ${{ runner.temp }}/container-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  test:
    name: Test frontend
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run project tests when defined
        run: npm test --if-present

      - name: Verify production bundle
        run: |
          npm run build
          test -f dist/index.html

  scan:
    name: Scan container image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: container-image-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Load built image
        run: docker load --input "${{ runner.temp }}/container-image.tar"

      - name: Scan for high and critical vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.2 image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            "$LOCAL_IMAGE"

  push:
    name: Push image to Azure Container Registry
    needs: scan
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download scanned image
        uses: actions/download-artifact@v4
        with:
          name: container-image-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Load scanned image
        run: docker load --input "${{ runner.temp }}/container-image.tar"

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Tag and push commit image
        run: |
          docker tag "$LOCAL_IMAGE" "$TARGET_IMAGE"
          docker push "$TARGET_IMAGE"

  deploy:
    name: Deploy to Azure Container Apps
    needs: push
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download scanned image
        uses: actions/download-artifact@v4
        with:
          name: container-image-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Load scanned image
        run: docker load --input "${{ runner.temp }}/container-image.tar"

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Ensure the exact scanned image is pushed
        run: |
          docker tag "$LOCAL_IMAGE" "$TARGET_IMAGE"
          docker push "$TARGET_IMAGE"

      - name: Update Azure Container App to the commit image
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$TARGET_IMAGE"
