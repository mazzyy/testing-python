name: container-ci-cd

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
  IMAGE_NAME: ${{ vars.CONTAINER_IMAGE }}
  LOCAL_IMAGE: local/static-frontend

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Build image from Dockerfile
        run: |
          set -euo pipefail
          docker build --tag "${LOCAL_IMAGE}:${GITHUB_SHA}" .
          docker save --output /tmp/container-image.tar "${LOCAL_IMAGE}:${GITHUB_SHA}"

      - name: Store built image
        uses: actions/upload-artifact@v4.6.2
        with:
          name: container-image
          path: /tmp/container-image.tar
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test frontend
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 20.18.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run project tests when defined
        run: npm test --if-present

      - name: Verify production build
        run: |
          set -euo pipefail
          npm run build
          test -d dist
          test -n "$(find dist -type f -print -quit)"

  scan:
    name: Scan container image
    needs:
      - build
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download built image
        uses: actions/download-artifact@v4.3.0
        with:
          name: container-image
          path: /tmp

      - name: Scan for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          input: /tmp/container-image.tar
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

  push:
    name: Push scanned image
    needs: scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate registry configuration
        run: |
          set -euo pipefail
          test -n "${REGISTRY}"
          test -n "${IMAGE_NAME}"

      - name: Download scanned image
        uses: actions/download-artifact@v4.3.0
        with:
          name: container-image
          path: /tmp

      - name: Log in to container registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ vars.CONTAINER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Tag and push image
        env:
          IMAGE: ${{ vars.CONTAINER_REGISTRY }}/${{ vars.CONTAINER_IMAGE }}
        run: |
          set -euo pipefail
          docker load --input /tmp/container-image.tar
          docker tag "${LOCAL_IMAGE}:${GITHUB_SHA}" "${IMAGE}:${GITHUB_SHA}"
          docker tag "${LOCAL_IMAGE}:${GITHUB_SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

  deploy:
    name: Deploy production image
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Trigger production deployment
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          IMAGE: ${{ vars.CONTAINER_REGISTRY }}/${{ vars.CONTAINER_IMAGE }}:${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_WEBHOOK_URL}"
          test -n "${DEPLOY_TOKEN}"
          payload="$(jq -n --arg image "${IMAGE}" --arg revision "${GITHUB_SHA}" '{image: $image, revision: $revision}')"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${DEPLOY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${payload}" \
            "${DEPLOY_WEBHOOK_URL}"
