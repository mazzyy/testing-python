name: Deploy to Heroku

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Heroku Container Registry
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com

      - name: Set up Python for sitemap generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sitemap dependencies
        run: pip install requests

      - name: Generate sitemap.xml
        run: python generate_sitemap.py
        env:
          API_BASE_URL: https://uniadvisor-ai-e51539ff1cfb.herokuapp.com

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.monolith -t registry.heroku.com/uniadvisor-ai/web .

      - name: Push to Heroku Container Registry
        run: |
          docker push registry.heroku.com/uniadvisor-ai/web

      - name: Release the image
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          # Get the Docker image ID from the registry
          IMAGE_ID=$(docker inspect registry.heroku.com/uniadvisor-ai/web --format='{{.Id}}')
          # Use Heroku Platform API to release the image (no CLI needed)
          curl -s -n -X PATCH https://api.heroku.com/apps/uniadvisor-ai/formation \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -d "{\"updates\": [{\"type\": \"web\", \"docker_image\": \"$IMAGE_ID\"}]}"
